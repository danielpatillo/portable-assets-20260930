name: Publish encrypted portable resources
on:
  push:
    branches: [main]
    paths: ['publication/v0.0.20/manifest.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: encrypted-portable-release
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify ciphertext, preserve existing assets and publish v0.0.20
        shell: python
        run: |
          import hashlib, json, os, pathlib, re, subprocess, tempfile, urllib.request, zipfile
          repo = os.environ['GITHUB_REPOSITORY']
          revision = os.environ['GITHUB_SHA']
          if repo != 'danielpatillo/portable-assets-20260930' or not re.fullmatch(r'[0-9a-f]{40}', revision):
              raise RuntimeError('Repository or revision differs')
          def read_public(path):
              url = f'https://raw.githubusercontent.com/{repo}/{revision}/{path}'
              with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent': 'ARQUINOVATOS-v20-publication'}), timeout=60) as response:
                  return response.read()
          def sha(data):
              return hashlib.sha256(data).hexdigest()
          raw = read_public('publication/v0.0.20/manifest.json')
          if sha(raw) != 'abea5fa045d04d6a69dc669d8a34832e5bf32c19635e34fa232ec981824b5ec7':
              raise RuntimeError('Pinned manifest differs')
          manifest = json.loads(raw)
          if manifest['version'] != '0.0.20' or manifest['repository'] != repo or manifest['tag'] != 'v1.0.0' or manifest['release_id'] != 400583482:
              raise RuntimeError('Manifest identity differs')
          asset = manifest['asset']
          if asset['name'] != 'launcher-resource-v0.0.20.zip' or asset['sha256'] != '29a705383652e6669d2b1c4e5e74f120285f390e6a4b2c5140403659fb7713fc' or asset['bytes'] != 38710728:
              raise RuntimeError('Pinned encrypted resource differs')
          preserved = manifest['preserved_assets']
          if len(preserved) != 19 or len({a['name'] for a in preserved}) != 19 or len({a['id'] for a in preserved}) != 19:
              raise RuntimeError('Preserved asset identities differ')
          def get_release():
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/releases/tags/v1.0.0']))
          def check_release(require_new=False):
              release = get_release()
              for key, value in manifest['preserved_release_metadata'].items():
                  if release.get(key) != value:
                      raise RuntimeError('Release metadata changed: ' + key)
              live = {a['name']: a for a in release['assets']}
              baseline = {a['name'] for a in preserved}
              allowed = (baseline | {asset['name']},) if require_new else (baseline, baseline | {asset['name']})
              if len(live) != len(release['assets']) or set(live) not in allowed:
                  raise RuntimeError('Unreviewed assets changed')
              for original in preserved:
                  remote = live[original['name']]
                  if any(remote.get(key) != value for key, value in original.items()):
                      raise RuntimeError('A preserved resource changed: ' + original['name'])
              if asset['name'] in live:
                  remote = live[asset['name']]
                  if remote['size'] != asset['bytes'] or remote.get('digest') != 'sha256:' + asset['sha256'] or remote.get('state') != 'uploaded':
                      raise RuntimeError('Existing v20 resource differs; no asset was deleted')
              return live
          with tempfile.TemporaryDirectory() as directory:
              target = pathlib.Path(directory) / asset['name']
              with target.open('wb') as stream:
                  for chunk in asset['chunks']:
                      if not re.fullmatch(r'publication/v0\.0\.20/chunks/launcher-resource-v0\.0\.20\.zip\.[0-9]{3}\.bin', chunk['path']):
                          raise RuntimeError('Chunk path differs')
                      data = read_public(chunk['path'])
                      if len(data) != chunk['bytes'] or sha(data) != chunk['sha256']:
                          raise RuntimeError('Encrypted chunk differs')
                      stream.write(data)
              if target.stat().st_size != asset['bytes'] or sha(target.read_bytes()) != asset['sha256']:
                  raise RuntimeError('Reconstructed resource differs')
              with zipfile.ZipFile(target) as archive:
                  if len(archive.namelist()) != 3 or set(archive.namelist()) != {'launcher-v0.0.20.7z', '7zip/x64/7za.exe', '7zip/License.txt'}:
                      raise RuntimeError('Public ZIP contains unexpected files')
                  if sha(archive.read('launcher-v0.0.20.7z')) != asset['cipher_sha256']:
                      raise RuntimeError('Ciphertext differs')
              live = check_release()
              if asset['name'] not in live:
                  subprocess.run(['gh', 'release', 'upload', 'v1.0.0', str(target), '--repo', repo], check=True)
              final = check_release(require_new=True)
              request = urllib.request.Request(final[asset['name']]['browser_download_url'], headers={'User-Agent': 'ARQUINOVATOS-v20-public-download'})
              with urllib.request.urlopen(request, timeout=120) as response:
                  downloaded = response.read()
              if len(downloaded) != asset['bytes'] or sha(downloaded) != asset['sha256']:
                  raise RuntimeError('Unauthenticated public download differs')
              check_release(require_new=True)
          print('Preserved 19 existing assets; uploaded and publicly downloaded the verified encrypted v0.0.20 resource.')
